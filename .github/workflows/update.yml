# Bangun data harian lalu terbitkan aplikasi + data ke GitHub Pages.
# Data tidak di-commit ke repo (agar repo tetap kecil); dibuat ulang setiap kali jalan.
name: Perbarui data ISSI

on:
  schedule:
    - cron: "45 9 * * 1-5"     # 16:45 WIB, Senin–Jumat (setelah bursa tutup)
  push:
    branches: [main]
  workflow_dispatch:            # tombol "Run workflow" manual

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python ambil_data.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
